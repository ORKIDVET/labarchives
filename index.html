<title>أرشيف تقارير المعمل — دواجن</title>
<style>
:root{--b:#1d4ed8;--b2:#2563eb;--bl:#eff6ff;--bd:#dbe3ef;--tx:#0f172a;--mu:#64748b;--ok:#15803d;--okb:#dcfce7;--hi:#b91c1c;--hib:#fee2e2;--lo:#b45309;--lob:#fef3c7;--un:#6d28d9;--unb:#ede9fe}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Kufi Arabic","Segoe UI","Noto Sans Devanagari","Nirmala UI","Mangal","Noto Nastaliq Urdu","Jameel Noori Nastaleeq",Tahoma,Arial,sans-serif;color:var(--tx);background:#f5f7fb;font-size:14px}
header{background:linear-gradient(90deg,#1e3a8a,#2563eb);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}
header small{opacity:.8}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bd);padding:6px 8px;position:sticky;top:0;z-index:5}
nav button{white-space:nowrap;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit;color:var(--mu)}
nav button.on{background:var(--bl);color:var(--b);font-weight:700}
main{padding:12px;max-width:1200px;margin:auto}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:#1e3a8a}
.card h3{font-size:14px;margin:12px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);min-width:0}
textarea{min-height:60px}
button.btn{font:inherit;border:1px solid var(--b2);background:var(--b2);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer}
button.btn.sec{background:#fff;color:var(--b2)}
button.btn.dan{background:#fff;color:var(--hi);border-color:#fca5a5}
button.btn.sm{padding:3px 8px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid #edf1f7;padding:5px 6px;text-align:start;vertical-align:top}
th{background:#f8fafc;color:#334155;font-weight:600;position:sticky;top:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:22px;color:#1e3a8a}
.kpi span{font-size:12px;color:var(--mu)}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.s-ok{background:var(--okb);color:var(--ok)}.s-high,.s-pos,.s-alert{background:var(--hib);color:var(--hi)}.s-low{background:var(--lob);color:var(--lo)}.s-unsure,.s-highCV{background:var(--unb);color:var(--un)}.s-none{background:#f1f5f9;color:var(--mu)}
td.c-high,td.c-pos,td.c-alert{background:#fff1f2}
.s-gHigh,.s-gLow,.s-gHighCV,.s-gUnsure{background:#f8fafc;color:#475569;border:1px dashed #94a3b8}.s-gOk{background:#f8fafc;color:#64748b;border:1px dashed #cbd5e1}.s-unitMismatch{background:var(--unb);color:var(--un)}
td.c-gHigh,td.c-gLow,td.c-gHighCV,td.c-gUnsure{background:#f8fafc;outline:1px dashed #cbd5e1;outline-offset:-3px}td.c-unitMismatch{background:#f5f3ff}
.s-few{background:#f1f5f9;color:#64748b}.s-lim{background:var(--lob);color:var(--lo)}.s-adq{background:var(--okb);color:var(--ok)}
button[disabled]{opacity:.45;cursor:not-allowed}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
html:lang(ur) body{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic UI","Noto Naskh Arabic","Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.75}
html:lang(hi) body{font-family:"Noto Sans Devanagari","Nirmala UI","Mangal","Segoe UI",Arial,sans-serif}
.logoBox{background:#fff;border-radius:8px;padding:3px 7px;display:flex;align-items:center}.logoBox img{height:26px;display:block}
.hero{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--bd);border-inline-start:4px solid var(--b2);border-radius:12px;padding:12px;margin-bottom:12px}
.hero img{height:54px;max-width:100%}.hero p{flex:1;min-width:220px;margin:0;line-height:1.9;color:#1e3a8a;font-weight:600}
.kc{border-top:1px solid #edf1f7;padding-top:8px;margin-top:10px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer;color:var(--tx)}.chip.on{background:var(--b2);color:#fff;border-color:var(--b2)}
.rpt{background:#fff;color:#0f172a;font-size:13px}.rpt-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:3px solid #1d4ed8;padding-bottom:10px;margin-bottom:10px}.rpt-head img{height:62px}.rpt-head h1{font-size:19px;margin:0 0 4px;color:#1e3a8a}
.rpt-intro{background:#eff6ff;border-inline-start:4px solid #2563eb;padding:8px 12px;border-radius:8px;margin:8px 0 12px;line-height:1.9;font-weight:600;color:#1e3a8a}
.rpt h2{font-size:15px;color:#1e3a8a;border-bottom:1px solid #dbe3ef;padding-bottom:4px;margin:18px 0 8px}.rpt h3{font-size:13.5px}
.rpt .sig{display:flex;gap:30px;margin-top:34px}.rpt .sig div{flex:1;border-top:1px solid #94a3b8;padding-top:4px;font-size:12px;color:#64748b}
.pb{break-inside:avoid}
@page{margin:12mm}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff}.rpt th{position:static}.rpt .tw{overflow:visible}.rpt .kpis{grid-template-columns:repeat(4,1fr)}}td.c-low{background:#fffbeb}td.c-unsure,td.c-highCV{background:#f5f3ff}td.c-ok{background:#f0fdf4}
.muted{color:var(--mu);font-size:12px}
.blk{border:1px dashed var(--bd);border-radius:10px;padding:10px;margin:8px 0;background:#fcfdff}
.ast{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
.ast label{flex-direction:row;align-items:center;justify-content:space-between;background:#f8fafc;padding:3px 6px;border-radius:6px;color:var(--tx)}
.ast select{padding:2px 4px}
.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:8px 10px;border-radius:10px;margin:6px 0;font-size:13px}
.info{background:var(--bl);border:1px solid #bfdbfe;color:#1e3a8a;padding:8px 10px;border-radius:10px;margin:6px 0;font-size:13px}
.err{background:var(--hib);border:1px solid #fca5a5;color:var(--hi);padding:8px 10px;border-radius:10px;margin:6px 0}
.bar{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;display:flex;min-width:120px}
.bar i{display:block;height:100%}
.chips{display:flex;gap:4px;flex-wrap:wrap}
#toast{position:fixed;bottom:16px;inset-inline-start:16px;background:#0f172a;color:#fff;padding:8px 14px;border-radius:10px;display:none;z-index:50}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:40;overflow:auto;padding:20px 8px}
#modal .box{background:#fff;max-width:900px;margin:auto;border-radius:12px;padding:14px}
svg text{font-family:inherit}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block}#printArea .noprint{display:none}}
footer{text-align:center;color:var(--mu);font-size:11px;padding:16px}
</style>
</head>

/* ---------- value parsing & judging ---------- */
function parseVal(raw){
 if(raw==null)return{n:null,q:'',t:'',empty:true};
 let s=String(raw).trim();if(s==='')return{n:null,q:'',t:'',empty:true};
 s=s.replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/٫/g,'.').replace(/(\d),(?=\d{3}(\D|$))/g,'$1');
 const low=s.toLowerCase();
 if(/^(neg|negative|nd\b|n\.d|not detected|absent|سلبي|سالب|غير موجود|لم يكتشف|لا يوجد)/.test(low))return{n:null,q:'',t:s,pos:false};
 if(/^(pos|positive|detected|present|موجب|إيجابي|ايجابي|موجود)/.test(low))return{n:null,q:'',t:s,pos:true};
 const m=s.match(/^(<=|>=|<|>|≤|≥)?\s*(-?\d+(?:\.\d+)?)(?:\s*[×xX]\s*10\s*\^?\s*(-?\d+)|[eE](-?\d+))?/);
 if(m){let n=+m[2];const e=m[3]!=null?m[3]:m[4];if(e!=null)n*=Math.pow(10,+e);const q=(m[1]||'').replace('≤','<').replace('≥','>').replace('=','');return{n,q,t:s}}
 return{n:null,q:'',t:s,text:true};
}
function judge(pv,lim){
 if(!pv||pv.empty)return'none';
 if(pv.pos===true)return'pos';
 if(pv.pos===false)return'ok';
 if(pv.n==null||!lim)return'none';
 const mn=numOrNull(lim.min),mx=numOrNull(lim.max);
 if(mn==null&&mx==null)return'none';
 const n=pv.n;
 if(pv.q==='<'){if(mn!=null&&n<=mn)return'low';if(mn==null&&mx!=null&&n<=mx)return'ok';return'unsure'}
 if(pv.q==='>'){if(mx!=null&&n>=mx)return'high';if(mx==null&&mn!=null&&n>=mn)return'ok';return'unsure'}
 if(mn!=null&&n<mn)return'low';if(mx!=null&&n>mx)return'high';return'ok';
}
function refFor(r){const t=repType(r);const id=r.refSetId||(t&&S.settings.defaultRef[r.category+':'+t])||S.settings.defaultRef[r.category];const rs=S.refSets.find(x=>x.id===id&&x.category===r.category)||null;if(rs&&rs.flockType&&!r.refSetId&&rs.flockType!==t)return null;return rs}
function limitFor(rs,param,age){if(!rs)return null;const a=numOrNull(age);return rs.items.find(i=>i.param===param&&(numOrNull(i.ageFrom)==null||a==null||a>=+i.ageFrom)&&(numOrNull(i.ageTo)==null||a==null||a<=+i.ageTo))||null}
function limText(l){if(!l)return'';const mn=numOrNull(l.min),mx=numOrNull(l.max);let s=mn!=null&&mx!=null?`${mn}–${mx}`:mn!=null?`≥ ${mn}`:mx!=null?`≤ ${mx}`:'';if(numOrNull(l.cvMax)!=null)s+=(s?' · ':'')+'CV ≤ '+l.cvMax+'%';return s}

/* ---------- serology statistics ---------- */
function parseList(txt){return String(txt||'').replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).split(/[\s,;،\t\n]+/).map(x=>x.trim()).filter(x=>x!=='').map(Number).filter(isFinite)}
function seroStats(s){
 const v=parseList(s.valuesText);const method=s.method||'';
 if(v.length){
  const n=v.length,mean=v.reduce((a,b)=>a+b,0)/n;
  const sd=n>1?Math.sqrt(v.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(n-1)):0;
  const cv=mean?sd/mean*100:null;
  let gmt=null;if(method==='HI')gmt=Math.pow(2,mean);else{const p=v.filter(x=>x>0);if(p.length)gmt=Math.exp(p.reduce((a,b)=>a+Math.log(b),0)/p.length)}
  const cut=numOrNull(s.cutoff);const posPct=cut!=null?v.filter(x=>x>=cut).length/n*100:null;
  return{n,mean,sd,cv,gmt,min:Math.min(...v),max:Math.max(...v),posPct,fromValues:true};
 }
 const mean=numOrNull(s.mean);
 return{n:numOrNull(s.n),mean,sd:null,cv:numOrNull(s.cv),gmt:method==='HI'&&mean!=null?Math.pow(2,mean):null,min:null,max:null,posPct:numOrNull(s.posPct),fromValues:false};
}

/* ---------- flags ---------- */
function reportFlags(r){
 const out=[];const rs=refFor(r);
 if(r.category==='water'||r.category==='feed'){
  (r.results||[]).forEach(x=>{if(!x.param)return;const pv=parseVal(x.value);if(pv.empty)return;const lim=limitFor(rs,x.param,r.ageWeeks);const nv=normalizeVal(r.category,x.param,pv,x.unit);
   let st=!nv.ok?(lim?'unitMismatch':'none'):judge(nv.pv,lim);if(lim)st=guardStatus(st,rs);
   out.push({param:x.param,label:paramName(r.category,x.param),value:x.value,unit:x.unit,status:st,limit:limText(lim),normN:nv.ok?nv.pv.n:null,normUnit:nv.ok?nv.unit:x.unit,unitOk:nv.ok,conv:nv.conv,q:pv.q||'',numeric:pv.n!=null,indicative:!!(lim&&!rs.verified)})});
 }else if(r.category==='serology'){
  (r.sero||[]).forEach(s=>{if(!s.test)return;const st=seroStats(s);const lim=limitFor(rs,s.test,r.ageWeeks);let status=st.mean==null?'none':judge({n:st.mean,q:''},lim);
   if(lim&&numOrNull(lim.cvMax)!=null&&st.cv!=null&&st.cv>+lim.cvMax&&(status==='ok'||status==='none'))status='highCV';
   if(lim)status=guardStatus(status,rs);const key=seroKey(s);
   out.push({param:key,label:seroKeyLabel(key),value:st.mean==null?'—':fmt(st.mean,s.method==='HI'?2:0),unit:s.unit,method:s.method,status,limit:limText(lim),stats:st,indicative:!!(lim&&!rs.verified)})});
 }else if(r.category==='micro'){
  (r.isolates||[]).forEach(i=>{if(!i.organism)return;const rc=Object.values(i.ast||{}).filter(v=>v==='R').length;
   out.push({param:i.organism,label:i.organism+(i.site?' — '+i.site:''),value:rc?tr(`مقاوم لـ ${rc} مضاد`,`R to ${rc} drugs`,"R to {0} drugs",[rc]):'',status:ALERT_ORG.test(i.organism)?'alert':rc>=3?'high':'none',limit:''})});
  (r.pcr||[]).forEach(p=>{if(!p.target)return;out.push({param:'PCR '+p.target,label:'PCR — '+p.target,value:(p.result||'')+(p.ct?' (Ct '+p.ct+')':''),status:p.result==='pos'?'pos':p.result==='neg'?'ok':p.result==='susp'?'unsure':'none',limit:''})});
 }
 return out;
}

/* ---------- dates ---------- */
function parseDate(x,fmt){
 if(x==null||x==='')return'';
 if(typeof x==='number'&&isFinite(x)){if(x>20000&&x<80000){const d=new Date(Date.UTC(1899,11,30)+Math.floor(x)*864e5);return d.toISOString().slice(0,10)}return''}
 if(x instanceof Date&&!isNaN(x))return x.toISOString().slice(0,10);
 let s=String(x).trim().replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
 if(/^\d{5}(\.\d+)?$/.test(s))return parseDate(+s);
 let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
 if(m)return valid(+m[1],+m[2],+m[3]);
 m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
 if(m){let y=+m[3];if(y<100)y+=2000;return fmt==='mdy'?valid(y,+m[1],+m[2]):valid(y,+m[2],+m[1])}
 return'';
 function valid(y,mo,d){const dt=new Date(Date.UTC(y,mo-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===mo-1&&dt.getUTCDate()===d?dt.toISOString().slice(0,10):''}
}
/* ---------- CSV ---------- */
function parseCSV(text){
 text=String(text).replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';
 const delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':(first.includes('\t')&&!first.includes(','))?'\t':',';
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c==='"')q=true;else if(c===delim){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}
 if(cur!==''||row.length){row.push(cur);rows.push(row)}
 return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function toCSV(rows){return '﻿'+rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n')}

  if(v.length&&numOrNull(s.mean)!=null&&Math.abs(+s.mean-st.mean)>Math.max(0.5,Math.abs(st.mean)*0.05))W.push(tr(`${nm}: المتوسط المكتوب ${s.mean} يختلف عن المحسوب ${fmt(st.mean,2)}`,`${nm}: stated mean differs from computed ${fmt(st.mean,2)}`,"{0}: stated mean differs from computed {1}",[nm,fmt(st.mean,2)]));
  if(s.method==='ELISA'&&st.mean!=null&&st.mean>50000)W.push(nm+': '+tr('متوسط ELISA مرتفع جدًا — تأكد من الوحدة','very high ELISA mean — check the unit'));
  if(s.method==='HI'&&s.unit&&!/log/i.test(s.unit))W.push(nm+': '+tr('وحدة HI ليست log2 — تأكد أن القيم log2 وليست عيارًا مباشرًا مثل 256','HI unit is not log2 — make sure values are log2, not e.g. 256'));
  if(s.method==='HI'&&numOrNull(s.cutoff)!=null&&+s.cutoff>16)W.push(nm+': '+tr('حد الإيجابية لـ HI يجب أن يكون log2','HI cut-off should be in log2'));
  if(st.cv!=null&&st.cv>150)W.push(nm+': CV '+fmt(st.cv,0)+'% '+tr('مرتفع بشكل غير معتاد','is unusually high'));
 });
 if(r.category==='micro')(r.pcr||[]).forEach(p=>{if(!p.target)return;const ct=numOrNull(p.ct);if(ct!=null&&(ct<5||ct>45))W.push(`PCR ${p.target}: Ct ${ct} — `+tr('خارج المدى المعتاد','outside usual range'));if(ct!=null&&p.result==='neg'&&ct<35)W.push(`PCR ${p.target}: `+tr('Ct منخفض مع نتيجة سلبية — راجع التقرير','low Ct with a negative result — check'))});
 return{errors:E,warnings:W};
}

/* ---------- integrity ---------- */
async function integrityCheck(){
 const keys=IDB?new Set(await idbKeys()):new Set();const missing=[];const refd=new Set();
 S.reports.forEach(r=>(r.attachments||[]).forEach(a=>{refd.add(a.id);if(!keys.has(a.id))missing.push({r,a})}));
 const orphans=[...keys].filter(k=>!refd.has(k));
 const ids=S.reports.map(r=>r.id);const dupIds=[...new Set(ids.filter((x,i)=>ids.indexOf(x)!==i))];
 return{missing,orphans,bad:S.reports.filter(r=>!r.id||!CATS[r.category]),dupIds,noDate:S.reports.filter(r=>!repDate(r)),files:keys.size,idb:!!IDB};
}

/* ---------- backup with manifest ---------- */
async function buildBackup(withFiles){
 const o={schemaId:APP.schema,schemaVersion:APP.schemaVersion,reports:clone(S.reports),refSets:clone(S.refSets),flocks:clone(S.flocks),settings:clone(S.settings),log:clone(S.log),exportedAt:new Date().toISOString(),generator:APP};
 const refd=[...new Set(o.reports.flatMap(r=>(r.attachments||[]).map(a=>a.id)))];
 const man={alg:null,coreHash:null,counts:{reports:o.reports.length,refSets:o.refSets.length,flocks:o.flocks.length,attachmentsReferenced:refd.length,files:0},withFiles:!!withFiles,missingFiles:[]};
 const d=await digest(JSON.stringify({reports:o.reports,refSets:o.refSets,flocks:o.flocks}));man.alg=d.alg;man.coreHash=d.hex;
 if(withFiles){o.files=[];if(IDB){for(const id of refd){const f=await idbGet(id);if(!f){man.missingFiles.push(id);continue}const u=new Uint8Array(await f.blob.arrayBuffer());const h=await digest(u,d.alg);o.files.push({id:f.id,name:f.name,type:f.type,size:u.length,hash:h.hex,data:bytesToB64(u)})}}else man.missingFiles=refd;man.counts.files=o.files.length}
 o.manifest=man;return o;
}
async function backup(withFiles){
 const o=await buildBackup(withFiles);
 download(`lab-archive-${withFiles?'full':'data'}-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(o),'application/json');
 const now=new Date().toISOString();if(withFiles){S.settings.lastBackupAt=now;S.settings.changesSinceBackup=0}else S.settings.lastDataBackupAt=now;save();
 toast(o.manifest.missingFiles.length?tr(`تم التنزيل — تنبيه: ${o.manifest.missingFiles.length} مرفق غير موجود في المتصفح`,`Downloaded — ${o.manifest.missingFiles.length} attachments missing`,"Downloaded — {0} attachments missing",[o.manifest.missingFiles.length]):tr('تم تنزيل النسخة الاحتياطية','Backup downloaded'));
 if(tab==='dash'||tab==='data')render();
}
async function analyzeBackup(j){
 const E=[],W=[],files=new Map();
 if(!j||typeof j!=='object'||j.schemaId!==APP.schema||!Array.isArray(j.reports)){E.push(tr('الملف ليس نسخة احتياطية لهذه الأداة','Not a backup of this tool'));return{errors:E,warnings:W,files,counts:{}}}
 if(+String(j.schemaVersion||'1').split('.')[0]>+APP.schemaVersion.split('.')[0])E.push(tr('النسخة من إصدار أحدث من هذه الأداة','Backup is from a newer version of the tool'));
 const counts={reports:j.reports.length,refSets:(j.refSets||[]).length,flocks:(j.flocks||[]).length,files:Array.isArray(j.files)?j.files.length:0};
 const m=j.manifest;
 if(!m)W.push(tr('نسخة من إصدار سابق بدون بصمة تحقق — لا يمكن التأكد من سلامتها بالكامل','Older backup without checksum — integrity cannot be fully confirmed'));
 else{['reports','refSets','flocks'].forEach(k=>{if(m.counts&&m.counts[k]!==counts[k])E.push(tr(`عدد ${k} في الملف (${counts[k]}) لا يطابق المسجل في البصمة (${m.counts[k]})`,`${k}: ${counts[k]} in file vs ${m.counts[k]} recorded`,"{0}: {1} in file vs {2} recorded",[k,counts[k],m.counts[k]]))});
  const d=await digest(JSON.stringify({reports:j.reports,refSets:j.refSets||[],flocks:j.flocks||[]}),m.alg);
  if(d.hex==null)W.push(tr('هذا المتصفح لا يدعم التحقق من بصمة SHA-256','SHA-256 not available in this browser'));else if(d.hex!==m.coreHash)E.push(tr('بصمة البيانات لا تطابق — الملف عُدّل أو تلف بعد التصدير','Data checksum mismatch — the file was edited or corrupted after export'));
  if(m.missingFiles&&m.missingFiles.length)W.push(tr(`${m.missingFiles.length} مرفق كان مفقودًا وقت أخذ النسخة`,`${m.missingFiles.length} attachments were already missing when the backup was taken`,"{0} attachments were already missing when the backup was taken",[m.missingFiles.length]))}
 const ids=new Set();let badRep=0,dupId=0;j.reports.forEach(r=>{if(!r||typeof r.id!=='string'||!CATS[r.category])badRep++;else if(ids.has(r.id))dupId++;else ids.add(r.id)});
 if(badRep)E.push(tr(`${badRep} تقرير بدون معرّف أو بنوع غير معروف`,`${badRep} reports without id or with unknown type`,"{0} reports without id or with unknown type",[badRep]));if(dupId)E.push(tr(`${dupId} معرّف تقرير مكرر`,`${dupId} duplicate report ids`,"{0} duplicate report ids",[dupId]));
 const refd=new Map();j.reports.forEach(r=>((r&&r.attachments)||[]).forEach(a=>refd.set(a.id,a)));
 if(Array.isArray(j.files)){
  for(const f of j.files){let u;try{u=b64ToBytes(f.data||'')}catch(e){E.push(tr(`الملف «${f.name}» تالف (ترميز غير صالح)`,`File “${f.name}” is corrupted (bad encoding)`,"File “{0}” is corrupted (bad encoding)",[f.name]));continue}
   if(f.size!=null&&u.length!==f.size){E.push(tr(`حجم الملف «${f.name}» لا يطابق (${u.length} بدل ${f.size} بايت)`,`Size mismatch for “${f.name}” (${u.length} vs ${f.size} bytes)`,"Size mismatch for “{0}” ({1} vs {2} bytes)",[f.name,u.length,f.size]));continue}
   if(f.hash&&m){const h=await digest(u,m.alg);if(h.hex&&h.hex!==f.hash){E.push(tr(`بصمة الملف «${f.name}» لا تطابق`,`Checksum mismatch for “${f.name}”`,"Checksum mismatch for “{0}”",[f.name]));continue}}
   files.set(f.id,{meta:f,bytes:u})}
  const miss=[...refd.keys()].filter(id=>!files.has(id));if(miss.length)W.push(tr(`${miss.length} مرفق مرتبط بتقارير غير موجود داخل النسخة`,`${miss.length} referenced attachments are not inside the backup`,"{0} referenced attachments are not inside the backup",[miss.length]));
 }else if(refd.size){const local=IDB?new Set(await idbKeys()):new Set();const miss=[...refd.keys()].filter(id=>!local.has(id)).length;W.push(tr(`نسخة بيانات فقط: ${refd.size} مرفق مرتبط، منها ${miss} غير موجود في هذا المتصفح ولن يُستعاد`,`Data-only backup: ${refd.size} attachments referenced, ${miss} not in this browser and will not be restored`,"Data-only backup: {0} attachments referenced, {1} not in this browser and will not be restored",[refd.size,miss]))}
 counts.attachmentsReferenced=refd.size;counts.filesValid=files.size;
 return{errors:E,warnings:W,files,counts,exportedAt:j.exportedAt||'',version:(j.generator&&j.generator.version)||''};
}

async function performRestore(mode){

const ftName=t=>FLOCK_TYPES[t]?(tl(FLOCK_TYPES[t][0],FLOCK_TYPES[t][1])):'';
const ftOpts=(sel,blank)=>`<option value="">${blank||tr('— غير محدد —','— not set —')}</option>`+Object.keys(FLOCK_TYPES).map(k=>`<option value="${k}" ${sel===k?'selected':''}>${ftName(k)}</option>`).join('');
function normFlockType(x){const s=String(x||'').toLowerCase().trim();if(!s)return'';if(/layer|بياض|commercial egg/.test(s))return'layer';if(/breeder|parent|أمهات|امهات|ps\b/.test(s))return'breeder';if(/broiler|لاحم|تسمين/.test(s))return'broiler';return''}
function repType(r){return r.flockType||((flockById(r.flockId)||{}).type)||''}
function repRegion(r){return r.region||((flockById(r.flockId)||{}).region)||''}
function repFarm(r){return r.farm||((flockById(r.flockId)||{}).farm)||''}
const INTRO=()=>tr('تتبُّع مسار العدوى من خلال تتبُّع تغيّرات نتائج العينات المؤرشفة يساعد في رسم الصورة الوبائية للقطيع والمزرعة والمنطقة، ويساعد أيضًا في اتخاذ القرار.','Tracking the course of infection through changes in archived sample results helps draw the epidemiological picture of the flock, the farm and the region, and also supports decision-making.');

function keyCurveData(type,testKey,filter){
 const pts=[];
 S.reports.filter(r=>r.category==='serology'&&repType(r)===type&&(!filter||filter(r))).forEach(r=>{const a=numOrNull(r.ageWeeks);if(a==null)return;
  (r.sero||[]).filter(s=>s.test===testKey).forEach(s=>{const st=seroStats(s);if(st.mean==null)return;const f=reportFlags(r).find(x=>x.param===testKey);
   pts.push({g:repWho(r)||tr('غير محدد','Unspecified'),x:a,y:st.mean,err:st.fromValues&&st.sd!=null?st.sd:null,cv:st.cv,n:st.n,date:repDate(r),flag:!!(f&&badFlag(f.status)),label:`${repWho(r)} · ${tr('عمر','age')} ${a} · ${fmt(st.mean,2)}${st.cv!=null?' · CV '+fmt(st.cv,0)+'%':''}`,r})})});
 return pts;
}
function serologySetFor(type){const id=(type&&S.settings.defaultRef['serology:'+type])||S.settings.defaultRef.serology;const rs=S.refSets.find(x=>x.id===id&&x.category==='serology')||null;if(rs&&rs.flockType&&rs.flockType!==type)return null;return rs}

function demoVals(mean,sd,n,seed,isInt){let x=(seed*7919)%233280;const rnd=()=>{x=(x*9301+49297)%233280;return x/233280};const out=[];for(let i=0;i<n;i++){const z=Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(2*Math.PI*rnd());const y=mean+sd*z;out.push(isInt?Math.max(0,Math.min(14,Math.round(y))):Math.max(0,Math.round(y/10)*10))}return out.join(' ')}

function statLine(s,st,lim,rs){
 if(st.mean==null)return`<span class="muted">${tr('لا توجد قيم بعد','No values yet')}</span>`;
 const status=(()=>{let x=judge({n:st.mean,q:''},lim);if(lim&&numOrNull(lim.cvMax)!=null&&st.cv!=null&&st.cv>+lim.cvMax&&(x==='ok'||x==='none'))x='highCV';return lim?guardStatus(x,rs):x})();
 const d=s.method==='HI'?2:0;
 return`<div class="chips"><span class="badge s-none">n = ${st.n??'—'}</span><span class="badge s-none">${tr('المتوسط','Mean')} ${fmt(st.mean,d)}</span>${st.gmt!=null?`<span class="badge s-none">GMT ${fmt(st.gmt,0)}</span>`:''}<span class="badge s-none">CV ${fmt(st.cv,1)}%</span>${st.min!=null?`<span class="badge s-none">${tr('المدى','Range')} ${fmt(st.min,d)}–${fmt(st.max,d)}</span>`:''}${st.posPct!=null?`<span class="badge s-none">${tr('إيجابي','Positive')} ${fmt(st.posPct,0)}%</span>`:''}${lim?`<span class="muted">${tr('المستهدف','Target')}: ${esc(limText(lim))}</span>`:''}${badge(status)}</div>`;
}
function setPath(o,p,v){const k=p.split('.');let x=o;for(let i=0;i<k.length-1;i++){const key=/^\d+$/.test(k[i])?+k[i]:k[i];if(x[key]==null)x[key]={};x=x[key]}x[k[k.length-1]]=v}
function getPath(o,p){return p.split('.').reduce((x,k)=>x==null?x:x[/^\d+$/.test(k)?+k:k],o)}
function onFormInput(e){
 const el=e.target;const p=el.dataset.p;if(!p||!D)return;
 let v=el.value;
 if(el.tagName==='SELECT'&&v==='__custom'){const base=p.split('.').slice(0,-1).join('.');const row=getPath(D,base);row.custom=true;row[p.split('.').pop()]='';$('#spec').innerHTML=specForm();return}
 if(p.includes('.ast.')){const [a,i,,...ab]=p.split('.');const iso=D[a][+i];iso.ast=iso.ast||{};const k=ab.join('.');if(v)iso.ast[k]=v;else delete iso.ast[k];return}
 setPath(D,p,v);
 if(p==='category'){S.settings.lastCat=v;if(v==='serology'&&!D.sero.length)D.sero.push(blankSero());if((v==='water'||v==='feed')&&!D.results.length)addStd();if(v==='micro'&&!D.isolates.length)D.isolates.push({organism:'',site:'',growth:'',ast:{}});D.refSetId='';render();return}
 if(/^results\.\d+\.param$/.test(p)&&el.tagName==='SELECT'){const row=getPath(D,p.replace(/\.param$/,''));row.custom=false;const pi=paramInfo(D.category,v);if(pi)row.unit=pi.u}
 if(/^sero\.\d+\.test$/.test(p)&&el.tagName==='SELECT'){const row=getPath(D,p.replace(/\.test$/,''));row.custom=false;const si=seroInfo(v);if(si){row.method=si.m;row.unit=defUnit(si.m)}}
 if(/^sero\.\d+\.method$/.test(p)){const row=getPath(D,p.replace(/\.method$/,''));if(!row.unit||['log2','titer','% pos'].includes(row.unit))row.unit=defUnit(v)}
 if(el.dataset.age){const f=flockById(D.flockId);if(f){if(p==='flockId'){if(!D.farm)D.farm=f.farm||'';if(!D.house)D.house=f.house||'';if(f.type)D.flockType=f.type;if(f.region&&!D.region)D.region=f.region}const a=ageFrom(f.placementDate,D.sampleDate||D.reportDate);if(a!=null&&(p==='flockId'||!D.ageWeeks||D._autoAge)){D.ageWeeks=String(a);D._autoAge=true;const ai=$('#ageIn');if(ai)ai.value=D.ageWeeks}if(p==='flockId'){render();return}}}
 if(p==='ageWeeks')D._autoAge=false;
 if(el.dataset.re&&e.type==='change'){$('#spec').innerHTML=specForm();return}
 if(el.dataset.live!=null){const i=+el.dataset.live;const x=D.results[i];$('#live'+i).innerHTML=x.value!==''?badge(liveStatus(D,x)):''}
 if(el.dataset.stat!=null){const i=+el.dataset.stat;const s=D.sero[i];$('#stat'+i).innerHTML=statLine(s,seroStats(s),limitFor(refFor(D),s.test,D.ageWeeks),refFor(D))}
}
function addStd(){const have=new Set(D.results.map(x=>x.param));(PARAMS[D.category]||[]).forEach(p=>{if(!have.has(p.k))D.results.push({param:p.k,value:'',unit:p.u})})}
function cleanReport(r){
 const o=clone(r);delete o._autoAge;delete o._removeAtt;delete o.qualityWarnings;
 o.results=(o.results||[]).filter(x=>x.param&&String(x.value).trim()!=='').map(x=>({param:x.param,value:String(x.value).trim(),unit:x.unit||''}));
 o.sero=(o.sero||[]).filter(s=>s.test&&(parseList(s.valuesText).length||numOrNull(s.mean)!=null||numOrNull(s.posPct)!=null)).map(s=>{delete s.custom;return s});
 o.isolates=(o.isolates||[]).filter(i=>i.organism);o.pcr=(o.pcr||[]).filter(p=>p.target);
 if(o.category!=='water'&&o.category!=='feed')o.results=[];if(o.category!=='serology')o.sero=[];if(o.category!=='micro'){o.isolates=[];o.pcr=[];o.findings='';o.diagnosis='';o.astMethod='';o.astStandard=''}

function validateReport(r){
 const e=[];if(!CATS[r.category])e.push(tr('نوع التقرير مطلوب','Type required'));
 if(!r.sampleDate&&!r.reportDate)e.push(tr('أدخل تاريخ العينة أو تاريخ التقرير','Enter sample or report date'));

 const a=numOrNull(r.ageWeeks);if(r.ageWeeks!==''&&(a==null||a<0||a>80))e.push(tr('العمر غير منطقي (0–80 أسبوع)','Age out of range (0–80 wk)'));
 const n=r.results.length+r.sero.length+r.isolates.length+r.pcr.length+(r.findings?1:0);if(!n)e.push(tr('لا توجد نتائج في التقرير','No results entered'));
 r.sero.forEach(s=>{const st=seroStats(s);if(st.posPct!=null&&(st.posPct<0||st.posPct>100))e.push(seroName(s.test)+': % '+tr('غير صحيحة','invalid'));if(s.method==='HI'&&st.mean!=null&&st.mean>16)e.push(seroName(s.test)+': '+tr('قيم HI تبدو ليست log2 (أكبر من 16)','HI values look non-log2 (>16)'))});

 if(!r.id){r.id=uid('rep');r.createdAt=now;S.reports.push(r);logA('add '+r.id)}else{r.updatedAt=now;const i=S.reports.findIndex(x=>x.id===r.id);S.reports[i]=r;logA('edit '+r.id)}
 save();pendingFiles=[];D=null;toast(tr('تم الحفظ','Saved'));tab='archive';render();viewReport(r.id);
}

 <div class="row" style="margin:8px 0"><button class="btn sec sm" data-act="cmpLast">${tr('اختيار آخر 4','Select latest 4')}</button><button class="btn sec sm" data-act="cmpClear">${tr('مسح الاختيار','Clear')}</button><button class="btn sec sm" data-act="cmpCsv">CSV</button><button class="btn sec sm" data-act="cmpPrint">${tr('طباعة','Print')}</button></div><div id="cmpOut"></div></div>`}
function compareTable(ids){
 const reps=ids.map(id=>S.reports.find(r=>r.id===id)).filter(Boolean).sort((a,b)=>repDate(a).localeCompare(repDate(b)));
 if(reps.length<2)return{html:`<div class="muted">${tr('اختر تقريرين على الأقل','Select at least two reports')}</div>`,rows:[]};
 const head=['',...reps.map(r=>`${repDate(r)}\n${repWho(r)}\n${tr('عمر','age')} ${r.ageWeeks||'—'}${r.samplePoint?'\n'+r.samplePoint:''}${r.dietName?'\n'+r.dietName:''}`)];
 const rows=[];const cat=reps[0].category;
 if(cat==='micro'){
  const orgs=[...new Set(reps.flatMap(r=>r.isolates.map(i=>i.organism)))];rows.push([tr('الميكروبات المعزولة','Isolates'),...reps.map(r=>({t:r.isolates.map(i=>i.organism).join('، ')||'—',s:r.isolates.some(i=>ALERT_ORG.test(i.organism))?'alert':'none'}))]);
  rows.push([tr('التشخيص','Diagnosis'),...reps.map(r=>({t:r.diagnosis||'—',s:'none'}))]);
  rows.push([tr('معيار التفسير','AST standard'),...reps.map(r=>({t:r.astStandard||'—',s:'none'}))]);
  const abs=[...new Set(reps.flatMap(r=>r.isolates.flatMap(i=>Object.keys(i.ast||{}).filter(a=>i.ast[a]))))];
  abs.forEach(ab=>rows.push([ab,...reps.map(r=>{const v=r.isolates.filter(i=>(i.ast||{})[ab]).map(i=>(orgs.length>1?i.organism.split(' ')[0]+': ':'')+i.ast[ab]);return{t:v.join(' · ')||'—',s:v.some(x=>x.endsWith('R'))?'high':v.some(x=>x.endsWith('I'))?'low':v.length?'ok':'none'}})]));
  const pc=[...new Set(reps.flatMap(r=>r.pcr.map(p=>p.target)))];pc.forEach(t=>rows.push(['PCR '+t,...reps.map(r=>{const p=r.pcr.find(x=>x.target===t);return{t:p?(p.result||'')+(p.ct?' Ct '+p.ct:''):'—',s:p?(p.result==='pos'?'pos':p.result==='neg'?'ok':'none'):'none'}})]));
 }else{
  const fls=reps.map(reportFlags);const keys=[],labels={};fls.forEach(fl=>fl.forEach(f=>{if(!keys.includes(f.param)){keys.push(f.param);labels[f.param]=f.label}}));
  const order=cat==='serology'?SERO.map(s=>s.k):(PARAMS[cat]||[]).map(p=>p.k);const ix=k=>{const i=order.indexOf(k);return i<0?999:i};keys.sort((a,b)=>ix(a)-ix(b));
  keys.forEach(k=>{let conv=false;
   const cells=fls.map(fl=>{const f=fl.find(x=>x.param===k);if(!f)return{t:'—',s:'none',n:null,u:null,q:''};
    if(cat==='serology'){const st=f.stats;return{t:`${f.value}${st.cv!=null?' · CV '+fmt(st.cv,0)+'%':''}${st.posPct!=null?' · +'+fmt(st.posPct,0)+'%':''}`,s:f.status,n:st.mean,u:normU(f.unit)+'|'+(f.method||''),q:''}}
    if(f.conv)conv=true;
    return{t:f.value+' '+(f.unit||''),s:f.status,n:f.unitOk?f.normN:null,u:f.numeric?(f.unitOk?normU(f.normUnit):'?'+normU(f.unit)):'text',q:f.q||''}});
   const units=[...new Set(cells.filter(c=>c.u!=null&&c.u!=='text').map(c=>c.u))];let t='',s='none';
   if(units.length>1){t='⚠ '+tr('وحدات أو طرق مختلفة — لم يُحسب التغير','Different units/methods — change not computed');s='unitMismatch'}
   else{const nums=cells.filter(c=>c.n!=null);if(nums.length>=2){if(nums.some(c=>c.q))t=tr('قيم حدّية (< أو >) — لم يُحسب التغير','Censored values — change not computed');else{const d=nums[nums.length-1].n-nums[0].n;t=(d>0?'+':'')+fmt(d,2)+(nums[0].n?` (${d>0?'+':''}${fmt(d/Math.abs(nums[0].n)*100,0)}%)`:'');if(conv)t+=' · '+tr('بعد توحيد الوحدة','after unit conversion')}}}
   rows.push([labels[k]||paramName(cat,k),...cells,{t,s}])});
  head.push(tr('التغير (الأول→الأخير)','Change first→last'));
 }
 const html=`<div class="tw"><table><tr>${head.map(h=>`<th style="white-space:pre-line">${esc(h)}</th>`).join('')}</tr>${rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td>${r.slice(1).map(c=>`<td class="c-${c.s}"><bdi>${esc(c.t)}</bdi></td>`).join('')}</tr>`).join('')}</table></div><div class="muted" style="margin-top:6px">${tr('الألوان: أحمر = أعلى من حد معتمد/إيجابي/مقاوم، برتقالي = أقل من الحد/متوسط، بنفسجي = تجانس ضعيف أو غير حاسم أو وحدات مختلفة، أخضر = ضمن الحدود، رمادي متقطع = مقارنة بحدود استرشادية غير معتمدة.','Colours: red = above verified limit/positive/resistant, amber = below/intermediate, purple = high CV/inconclusive/unit mismatch, green = within, dashed grey = indicative (unverified) limits.')}</div>`;
 return{html,rows:[head.map(h=>h.replace(/\n/g,' | ')),...rows.map(r=>[r[0],...r.slice(1).map(c=>c.t)])]};
}

 <div id="trOut" style="margin-top:10px"></div></div>`}
function trendData(){
 const pts=[],skipped={nonNum:0,unit:0};
 S.reports.filter(r=>r.category===TF.cat&&(!TF.flock||repWho(r)===TF.flock)).forEach(r=>{
  const xv=TF.x==='age'?numOrNull(r.ageWeeks):Date.parse(repDate(r));if(xv==null||!isFinite(xv))return;
  const gname=TF.group==='flock'?repWho(r)||tr('غير محدد','Unspecified'):TF.group==='point'?(r.samplePoint||r.dietName||r.sampleType||'—'):TF.group==='lab'?(r.labName||'—'):tr('الكل','All');
  const fl=reportFlags(r);
  if(TF.cat==='serology'){(r.sero||[]).filter(s=>seroKey(s)===TF.param).forEach(s=>{const st=seroStats(s);const y=st[TF.metric];if(y==null||!isFinite(y)){skipped.nonNum++;return}const f=fl.find(x=>x.param===TF.param);pts.push({g:gname,x:xv,y,err:TF.metric==='mean'&&st.sd!=null&&st.fromValues?st.sd:null,flag:f&&badFlag(f.status),label:`${repDate(r)} · ${tr('عمر','age')} ${r.ageWeeks||'—'} · ${fmt(y,2)}`,r})})}
  else(r.results||[]).filter(x=>x.param===TF.param).forEach(x=>{const pv=parseVal(x.value);if(pv.empty)return;if(pv.n==null){skipped.nonNum++;return}const nv=normalizeVal(TF.cat,x.param,pv,x.unit);if(!nv.ok){skipped.unit++;return}const f=fl.find(z=>z.param===x.param);pts.push({g:gname,x:xv,y:nv.pv.n,q:pv.q||'',flag:f&&badFlag(f.status),label:`${repDate(r)} · ${x.value} ${x.unit||''}${nv.conv?' → '+round6(nv.pv.n)+' '+nv.unit:''}`,r})});
 });
 return{pts,skipped};
}
function trendBands(){
 const rs=S.refSets.find(x=>x.id===S.settings.defaultRef[TF.cat]&&x.category===TF.cat)||null;
 if(!rs)return{bands:[],rs:null,note:''};
 if(rs.flockType)return{bands:[],rs:null,note:tr('الحدود الافتراضية خاصة بنوع قطيع — شاهدها في «منحنيات مهمة» بلوحة المتابعة','Default limits are flock-type specific — see “Key curves” on the dashboard')};
 const key=TF.cat==='serology'?String(TF.param).split('|')[0]:TF.param;
 const items=rs.items.filter(i=>i.param===key);if(!items.length)return{bands:[],rs,note:''};
 let mk;
 if(TF.cat==='serology'){if(TF.metric==='mean')mk=i=>({min:numOrNull(i.min),max:numOrNull(i.max)});else if(TF.metric==='cv')mk=i=>({min:null,max:numOrNull(i.cvMax)});else return{bands:[],rs,note:''}}
 else mk=i=>({min:numOrNull(i.min),max:numOrNull(i.max)});
 const aged=items.some(i=>numOrNull(i.ageFrom)!=null||numOrNull(i.ageTo)!=null);
 if(aged&&TF.x!=='age')return{bands:[],rs,note:tr('الحدود تتغير حسب العمر — اختر المحور «العمر» لرؤيتها','Limits vary with age — choose the age axis to see them')};
 return{bands:items.map(i=>Object.assign({x0:TF.x==='age'?numOrNull(i.ageFrom):null,x1:TF.x==='age'?numOrNull(i.ageTo):null},mk(i))).filter(b=>b.min!=null||b.max!=null),rs,note:''};
}

 if(TF.cat==='serology')notes.push(tr('HI و ELISA اختباران منفصلان ولا تُقارن عياراتهما ببعض.','HI and ELISA are separate tests; their titres are never compared.'));

function importFlocks(j){
 const fs=(j&&j.flocks)||[];let n=0;const farmName=(j.farm&&(j.farm.nameAr||j.farm.nameEn))||'';
 fs.forEach(f=>{const id='fl-'+f.id;if(S.flocks.some(x=>x.id===id))return;const h=(f.houses||[])[0]||{};S.flocks.push({id,farm:farmName||f.farmId||'',flockNo:f.flockNumber||'',house:h.houseNumber!=null?String(h.houseNumber):'',breed:[f.breed&&f.breed.strain,f.breed&&f.breed.geneticLine].filter(Boolean).join(' '),placementDate:f.placementDate||'',type:'breeder',region:'',source:'al-ghadir-flock-data'});n++});
 return n;
}
function mergeState(cur,j,mode){

 if(mode==='replace')return Object.assign(defaultState(),{reports:j.reports,refSets:j.refSets||[],flocks:j.flocks||[],settings:Object.assign({defaultRef:{}},j.settings||{}),log:j.log||[]});
 const n=clone(cur);const ids=new Set(n.reports.map(r=>r.id));j.reports.forEach(r=>{if(!ids.has(r.id))n.reports.push(r)});const rids=new Set(n.refSets.map(r=>r.id));(j.refSets||[]).forEach(r=>{if(!rids.has(r.id))n.refSets.push(r)});const fids=new Set(n.flocks.map(r=>r.id));(j.flocks||[]).forEach(r=>{if(!fids.has(r.id))n.flocks.push(r)});return n;
}
